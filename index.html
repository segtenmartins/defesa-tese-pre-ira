ome, morte, martírio","Ap 7:14 — Lavaram suas vestes no sangue do Cordeiro"]},{id:"arrebatamento",icon:mn,emoji:"☁️",label:"O LIVRAMENTO",title:"O ARREBATAMENTO - ENCONTRO NOS ARES",paragraphs:["Antes da ira, Jesus vem buscar os Seus.","Ele não pisa na terra. Nós subimos para encontrá-Lo nos ares.","João viu: uma multidão de TODAS as nações, povos e línguas, diante do trono. É a Igreja vitoriosa.","Na cabeça, uma coroa STEPHANOS: coroa de noivo, de festa, de vencedor.","A palavra é APANTESIS: sair ao encontro do Rei para voltar com Ele em glória.","Isso não é fuga. É livramento por amor."],verses:["1Ts 4:17 — Seremos arrebatados ao encontro do Senhor nos ares","Ap 7:9-14 — Uma multidão que ninguém podia contar","Ap 14:14-16 — Ceifa da terra, Jesus na nuvem"]},{id:"ceu",icon:vn,emoji:"\uD83D\uDC51",label:"ENQUANTO A IRA CAI NA TERRA",title:"NO CÉU - TRIBUNAL E BODAS",paragraphs:["No céu não tem condenação para quem está em Cristo.","Tem o BEMA. No grego, tribunal de recompensa. É como um pódio olímpico.","Jesus não vai te julgar para te condenar. Vai te recompensar pelo que você fez por amor a Ele.","E depois, as BODAS. GAMOS, no grego. Festa de casamento.","O vestido da noiva? Linho finíssimo, que são as justiças dos santos. Sua vida com Jesus costura esse vestido hoje.","Você quer estar vestido para a festa?"],verses:["2Co 5:10 — Tribunal (bema) de Cristo","Ap 19:7-8 — Chegaram as bodas do Cordeiro","Ap 19:8 — Linho fino são os atos de justiça dos santos"]},{id:"ira",icon:Or,emoji:"⚡",label:"O JUÍZO DE DEUS",title:"IRA DE DEUS - O JUÍZO",paragraphs:["Aqui tudo muda.","Em Apocalipse 15:1 a Bíblia diz: ETELÉSTHE HÊ ORGÊ. É aqui que a ira SE CONSUMA. Se completa.","Antes, em Apocalipse 6:17, era só o anúncio: 'Chegou o grande dia da ira'. ELTHEN - chegou.","Agora é o derramamento. As 7 taças de Apocalipse 16: feridas malignas, mar virando sangue, rios em sangue, sol que queima, trevas, o maior terremoto da história.","Não é perseguição humana. É Deus julgando um mundo que rejeitou Seu Filho.","Quem ficou, vai enfrentar isso."],verses:["Ap 15:1 — Neles se consumou (etelesthe) a ira de Deus","Ap 16 — As 7 taças do furor de Deus","Ap 6:17 — Anúncio da ira (elthen)"]},{id:"salvos",icon:Tr,emoji:"\uD83D\uDEE1️",label:"AINDA HÁ ESPERANÇA, MAS COM PREÇO",title:"SALVOS NA IRA",paragraphs:["Deus não se esquece.","Mesmo na ira, Ele sela 144 mil judeus. SPHRAGISOMEN - selados, marcados, protegidos. Como Israel no Egito quando as pragas caíam.","E muitos se converterão na ira. A Bíblia diz que foram degolados por não negarem Jesus.","PELEKISTHÉNTON, no grego: cortados com machado, decapitados. Morrem, mas reinam com Cristo.","Ainda dá tempo de ser salvo na ira. Mas o preço é a própria vida.","Por que pagar com sangue o que Jesus já pagou na cruz hoje, de graça?"],verses:["Ap 7:3 — Sphragisomen, selai os servos de Deus","Ap 20:4 — Pelekisthenton, os degolados por causa de Jesus","Ap 7:3-8 — 144 mil selados"]},{id:"volta",icon:Pr,emoji:"⛰️",label:"O REI VOLTA",title:"VOLTA DE JESUS PISANDO NA TERRA",paragraphs:["Depois da ira, Jesus volta de verdade. Com os pés na terra.","Zacarias profetizou: naquele dia, os pés dEle estarão sobre o Monte das Oliveiras, e o monte se fenderá ao meio.","João viu: o céu aberto, um cavalo branco, e Alguém fiel e verdadeiro. Na cabeça, muitas coroas DIADEMATA: coroas de Rei Juiz.","E atrás dEle, exércitos vestidos de linho fino, branco e puro. Somos nós. Voltando com Ele.","É o fim do anticristo. É o fim da mentira."],verses:["Zc 14:4 — Seus pés estarão sobre o Monte das Oliveiras","Ap 19:11-14 — Rei dos reis, com DIADEMATA (coroas de Rei)","Ap 19:14 — Exércitos no céu O seguiam em linho fino"]},{id:"milenio",icon:_r,emoji:"\uD83D\uDD4A️",label:"1000 ANOS",title:"MILÊNIO - 1000 ANOS DE PAZ",paragraphs:["Mil anos de paz real.","Sem guerra. Sem fome. Sem anticristo.","Jesus reinando a partir de Jerusalém.","E você, se foi fiel, reinando com Ele.","Apocalipse 20 diz que os que foram fiéis até a morte viverão e reinarão com Cristo por mil anos.","Você vai reinar com Ele?"],verses:["Ap 20:4-6 — Viveram e reinaram com Cristo mil anos"]},{id:"salvos-milenio",icon:yr,emoji:"\uD83D\uDC76\uD83D\uDC51",label:"O DIFERENCIAL - ARGUMENTO CHAVE",title:"SALVOS NO MILÊNIO - O FATO QUE CONTRAFAZ O PÓS-TRIB",paragraphs:["Este é o ponto que o pós-trib não explica. Se a igreja foi arrebatada e voltou glorificada em Ap 19, quem vai povoar o milênio?","Is 65:20-23 diz que no milênio haverá nascimento, criança, velho, casas, vinhas. São pessoas com corpo natural que entraram vivas após o tribunal das nações Mt 25:31-32.","Elas terão filhos por 1000 anos. Esses filhos nascem sem pecado herdado de Adão? Não, ainda precisam crer. Por isso no final Ap 20:7-8 Satanás é solto e engana nações (ethne) Gog e Magogue que nasceram no milênio.","Prova que haverá salvos no milênio por fé, não só ressuscitados. Se fosse tudo pós-trib em um evento só, não teria população natural para se rebelar no final.","Pré-ira explica: arrebatados glorificados reinam (symbasileusousin) + povos naturais salvos no tribunal entram para procriar."],verses:["Is 65:20 makros hemeron (longo de dias)","Zc 8:5 paidia (meninos) brincando","Mt 25:34 kleronomesate (herdai)","Ap 20:7-8 ethne (nações) no milênio","1Co 15:25 dei basileuein (é necessário que reine) até pôr inimigos debaixo dos pés"],accent:"blue"},{id:"juizo",icon:Nr,emoji:"⚖️",label:"A ÚLTIMA DECISÃO",title:"JUÍZO FINAL E ETERNIDADE",paragraphs:["No fim, o Grande Trono Branco.","Todos os que rejeitaram Jesus, de todas as épocas, diante do Juiz.","Os livros são abertos. Ninguém se justifica sozinho.","Depois, João vê: novos céus e nova terra. Deus enxugando toda lágrima. Sem mais morte, nem dor, nem choro.","A Bíblia só fala de duas eternidades:","Com Deus para sempre. Ou longe dEle para sempre.","Não existe meio termo."],verses:["Ap 20:11-15 — Trono Branco, juízo final","Ap 21:4 — Enxugará dos olhos toda lágrima","Ap 21-22 — Novos céus e nova terra"]}];function Ni(){let e=
