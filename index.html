 PRÉ-IRA?",paragraphs:["É simples. Muito simples.","A Igreja passa pela TRIBULAÇÃO, que é a perseguição do anticristo.","Mas é livrada da IRA, que é o juízo de Deus sobre o mundo.","Deus não prometeu te livrar da perseguição. Ele prometeu te livrar da condenação.","Perseguição vem do homem. Ira vem de Deus. São coisas diferentes."],verses:["1Ts 1:10 — Jesus, que nos livra da ira futura"]},{id:"hoje",icon:cr,emoji:"\uD83C\uDFDB️",label:"VOCÊ ESTÁ AQUI",title:"HOJE - ERA DA IGREJA",paragraphs:["Hoje é o tempo da graça. A porta está aberta.","Jesus anda no meio das igrejas. Ele vê. Ele chama ao arrependimento.","É tempo de voltar. De ouvir. De decidir.","Ainda não é tarde. Mas não será para sempre."],verses:["Ap 2-3 — Eis que estou à porta e bato","Ap 3:8 — Eis que diante de ti pus uma porta aberta"]},{id:"tribulacao",icon:pr,emoji:"\uD83D\uDD25",label:"PRESSÃO E PERSEGUIÇÃO",title:"TRIBULAÇÃO - O QUE É?",paragraphs:["Tribulação não é ira de Deus. É THLIPSIS no grego: pressão, esmagamento, perseguição.","É o anticristo perseguindo quem não aceitar a marca e não negar Jesus.","A igreja no Brasil já sofre preconceito. Imagina quando for proibido comprar ou vender sem a marca?","Jesus avisou: sereis odiados por causa do meu nome.","Apocalipse 6 mostra os selos: guerra, fome, morte e o martírio dos que guardam a fé.","Mas veja: salvos na tribulação lavam suas vestes no sangue do Cordeiro. Ainda há salvação."],verses:["Mt 24:9 — Sereis odiados por causa do meu nome","Ap 6 — os 4 selos: guerra, fome, morte, martírio","Ap 7:14 — Lavaram suas vestes no sangue do Cordeiro"]},{id:"arrebatamento",icon:fr,emoji:"☁️",label:"O LIVRAMENTO",title:"O ARREBATAMENTO - ENCONTRO NOS ARES",paragraphs:["Antes da ira, Jesus vem buscar os Seus.","Ele não pisa na terra. Nós subimos para encontrá-Lo nos ares.","João viu: uma multidão de TODAS as nações, povos e línguas, diante do trono. É a Igreja vitoriosa.","Na cabeça, uma coroa STEPHANOS: coroa de noivo, de festa, de vencedor.","A palavra é A
